[package]
name = "honest-server"
version = "0.4.0"
edition = "2024"
description = "Check Zcash light-wallet servers against full blocks from Zcash peers"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
equihash = "0.3"
hex = "0.4.3"
hyper-util = "0.1.21"
incrementalmerkletree = "0.9"
orchard = { version = "0.16", default-features = false }
prost = "0.14.4"
sapling-crypto = { version = "0.9", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-socks = "0.5.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14.8", features = ["tls-ring", "tls-native-roots", "channel"] }
tonic-prost = "0.14.8"
tower = "0.5.3"
zcash_primitives = "0.31"
zcash_protocol = "0.11"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.8"
