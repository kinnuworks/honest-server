name: table

# Checks every server in servers.txt over Tor and publishes web/ with the
# fresh results.json: to Vercel when a VERCEL_TOKEN secret is set, and to
# GitHub Pages once the repository is public.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: table
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_ejLhRQeXv0garFSL3yO0tjZJ
  VERCEL_PROJECT_ID: prj_3p18Fg6GOcGi7AT4etZxHQPOzY1K

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Tor
        run: |
          sudo apt-get update -q && sudo apt-get install -yq tor
          sudo systemctl start tor
          for i in $(seq 1 60); do
            if curl -s --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -q '"IsTor":true'; then break; fi
            sleep 2
          done
      - run: cargo build --release
      - name: Fetch the published history
        run: curl -sfL https://kinnuworks.github.io/honest-server/history.json -o web/history.json || curl -sfL https://honest-server.vercel.app/history.json -o web/history.json || true
      - run: ./target/release/honest-server table --servers servers.txt --out web/results.json --history web/history.json --tor 127.0.0.1:9050
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: env.VERCEL_TOKEN != ''
        working-directory: web
        run: npx --yes vercel@57 deploy --prod --yes --token "$VERCEL_TOKEN"
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: web
  pages:
    needs: check
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
